<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CV Page | Sergei Kasianov</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="wrapper">
		<!-- Header -->
		<header class="header">
			<div class="container">
				<img class="logo" src="" alt="logo"></img>

					<ul class="main-nav-list">
						<li class="main-nav-item">
							<a class="main-nav-link" href="#">About</a>

						<li class="main-nav-item">
							<a class="main-nav-link" href="#">Skills</a>
						</li>
						<li class="main-nav-item">
							<a class="main-nav-link" href="#">Courses</a>
						</li>
						<li class="main-nav-item">
							<a class="main-nav-link" href="#">Projects</a>
						</li>
						<li class="main-nav-item">
							<a class="main-nav-link" href="#">Contacts</a>
						</li>
					</ul>
				</nav>
				<!-- Button Mobile Navigation -->
				<button class="btn-mobile-nav" style="display: none;"></button>
			</div>
		</header>
		<!-- Main -->
		<main class="main">
			<!-- Hero Section -->
			<div class="section-hero">
				<div class="container center-content">
					<div class="section-hero-inner">
						<img class="avatar" src="#" alt="avatar">
						<h1 class="main-title">Sergei Kasianov</h1>
						<p class="main-subtitle">Front-end Developer</p>
						<a class="btn-github-link" href="https://github.com/sergdekas" target="_blank">View GitHub</a>
					</div>
				</div>
			</div>
			<!-- About Section -->
			<div class="section" id="about">
				<div class="container">
					<h2 class="section-title">About</h2>
					<p class="section-content"></p>
				</div>
			</div>
			<!-- Skills Section -->
			<div class="section" id="skills">
				<div class="container">
					<h2 class="section-title">Technical Skills</h2>
					<p class="section-content"></p>
				</div>
			</div>
			<!-- Code Section -->
			<div class="section" id="code">
				<div class="container">
					<h2 class="section-title">Code Example</h2>
					<p class="section-content"></p>
				</div>
			</div>
			<!-- Projects Section -->
			<div class="section" id="projects">
				<div class="container">
					<h2 class="section-title">Projects</h2>
					<p class="section-content"></p>
				</div>
			</div>
			<!-- Courses Section -->
			<div class="section" id="courses">
				<div class="container">
					<h2 class="section-title">Education</h2>
					<p class="section-content"></p>
				</div>
			</div>
			<!-- Languages Section -->
			<div class="section" id="languages">
				<div class="container">
					<h2 class="section-title">Languages</h2>
					<p class="section-content"></p>
				</div>
			</div>
		</main>
		<footer class="footer">
			<div class="container">
				<a class="footer-rsschool-link" href="https://rs.school/courses/javascript-ru">
					<img class="footer-rsschool-logo" src="assets" alt="Rolling Scopes School Logo">
				</a>
				<span class="footer-year">2024</span>
				<a class="footer-github-link" href="https://github.com/sergdekas">sergdekas</a>
